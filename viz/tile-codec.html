<!doctype html><meta charset=utf-8><title>384-byte tile codec</title><svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="ui-sans-serif,system-ui,sans-serif"><rect width="900" height="570" fill="#0f1115"/><text x="40" y="52" fill="#e8ecf1" font-size="24" font-weight="600">The 384-byte tile: same budget, different codec</text><text x="40" y="80" fill="#8b98a8" font-size="14">2525 real tiles mined from our own docs &#183; gte-small 384-d &#183; query = question, index = codec representation &#183; bars = top-1 retrieval</text><text x="40" y="148" fill="#c9d4e0" font-size="15">A  deterministic text fields</text><rect x="300" y="132" width="320" height="22" rx="4" fill="#1b2029"/><rect x="300" y="132" width="229.3" height="22" rx="4" fill="#4a7fb5"/><text x="539" y="149" fill="#e8ecf1" font-size="15" font-weight="600">0.7164</text><text x="609" y="149" fill="#8b98a8" font-size="13">cos 0.9650</text><text x="40" y="194" fill="#c9d4e0" font-size="15">B  int8 (384-d vector)</text><rect x="300" y="178" width="320" height="22" rx="4" fill="#1b2029"/><rect x="300" y="178" width="220.0" height="22" rx="4" fill="#7a6fb0"/><text x="530" y="195" fill="#e8ecf1" font-size="15" font-weight="600">0.6876</text><text x="600" y="195" fill="#8b98a8" font-size="13">cos 0.9999</text><text x="40" y="240" fill="#c9d4e0" font-size="15">C  MSE-trained 96-d bottleneck</text><rect x="300" y="224" width="320" height="22" rx="4" fill="#1b2029"/><rect x="300" y="224" width="177.7" height="22" rx="4" fill="#b5645f"/><text x="488" y="241" fill="#e8ecf1" font-size="15" font-weight="600">0.5552</text><text x="558" y="241" fill="#8b98a8" font-size="13">cos 0.9667</text><text x="40" y="286" fill="#c9d4e0" font-size="15">E  retrieval-trained 96-d</text><rect x="300" y="270" width="320" height="22" rx="4" fill="#1b2029"/><rect x="300" y="270" width="281.0" height="22" rx="4" fill="#2e8b57"/><text x="591" y="287" fill="#e8ecf1" font-size="15" font-weight="600">0.8782</text><text x="40" y="332" fill="#c9d4e0" font-size="15">F  hybrid (MSE + retrieval)</text><rect x="300" y="316" width="320" height="22" rx="4" fill="#1b2029"/><rect x="300" y="316" width="280.9" height="22" rx="4" fill="#3aa06a"/><text x="591" y="333" fill="#e8ecf1" font-size="15" font-weight="600">0.8778</text><text x="661" y="333" fill="#8b98a8" font-size="13">cos 0.9342</text><rect x="40" y="390" width="820" height="130" rx="8" fill="#161b23" stroke="#26303d"/><text x="60" y="418" fill="#7fd1a8" font-size="16" font-weight="600">The objective, not the budget</text><text x="60" y="442" fill="#c9d4e0" font-size="14">Same 96 floats: 0.5552 under MSE &#8594; 0.8782 under InfoNCE (+0.32).</text><text x="60" y="466" fill="#c9d4e0" font-size="14">And it beats the deterministic text codec (0.7164) by +0.16 at identical bytes.</text><text x="60" y="490" fill="#e0b07a" font-size="14">Latent bug, fixture-proven: a UTF-8 codepoint split at a field boundary &#8594; decode_binary returns None &#8594; whole tile lost (1.58% of our corpus).</text></svg>
